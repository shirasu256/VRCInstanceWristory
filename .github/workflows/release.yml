# 版のタグ（v0.2.0 など）を push すると、自動検証を通したうえでインストーラーを作り、GitHub の Releases へ公開する（→実装メモ5.121）。
# アプリの自動更新は、ここで公開した Releases から新しい版を探す。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 版を決める
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 自動検証
        run: dotnet test -c Release -p:Version=${{ env.VERSION }}

      - name: インストーラーを作る
        shell: pwsh
        run: pwsh scripts/package.ps1 -Version ${{ env.VERSION }} -DownloadPrevious -RepoUrl https://github.com/${{ github.repository }} -Token ${{ secrets.GITHUB_TOKEN }}

      - name: Releases へ公開する
        run: dotnet vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --publish --releaseName "VRC Instance Wristory v${{ env.VERSION }}" --tag ${{ github.ref_name }} --outputDir artifacts/releases
